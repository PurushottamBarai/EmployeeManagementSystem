<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="container">
            <h1>Employee Management System</h1>
            <p class="subtitle">REST API Dashboard</p>
        </div>
    </header>

    <main class="container">
        <!-- Notification / Message Banner -->
        <div id="alert-banner" class="alert hidden" role="alert"></div>

        <section class="card form-section">
            <h2 id="form-title">Add New Employee</h2>
            <form id="employee-form">
                <input type="hidden" id="employee-id">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">Full Name *</label>
                        <input type="text" id="name" required maxlength="100" placeholder="e.g. Rahul Sharma">
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" required maxlength="150" placeholder="e.g. rahul@example.com">
                    </div>

                    <div class="form-group">
                        <label for="department">Department</label>
                        <input type="text" id="department" maxlength="100" placeholder="e.g. Engineering">
                    </div>

                    <div class="form-group">
                        <label for="salary">Salary (INR) *</label>
                        <input type="number" id="salary" required min="1" step="0.01" placeholder="e.g. 50000">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submit-btn" class="btn btn-primary">Save Employee</button>
                    <button type="button" id="cancel-btn" class="btn btn-secondary hidden">Cancel</button>
                </div>
            </form>
        </section>

        <section class="card table-section">
            <div class="table-header">
                <h2>Employees List</h2>
                <button type="button" id="refresh-btn" class="btn btn-outline">Refresh</button>
            </div>

            <div class="table-responsive">
                <table class="employee-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Salary</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="employee-tbody">
                        <tr>
                            <td colspan="6" class="text-center">Loading employees...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
